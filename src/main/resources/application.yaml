spring:
  application:
    name: fintechBookingSystem
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
      open-in-view: false #Desactiva el antipatron OSIV,fuerza a resolver LAZY dentro del service y mejora rendimiento
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
  server:
    port: 8080
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics


